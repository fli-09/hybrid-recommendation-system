services:
  recommendation-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hybrid_recommendation_api

    ports:
      - "8000:8000"

    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro

    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: "INFO"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=10)" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
