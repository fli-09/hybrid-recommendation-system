name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Provision artifacts for CI
        run: |
          python scripts/provision_artifacts.py
        env:
          ARTIFACT_ARCHIVE_URL: ${{ secrets.ARTIFACT_ARCHIVE_URL }}

      - name: Run tests
        run: pytest tests/
